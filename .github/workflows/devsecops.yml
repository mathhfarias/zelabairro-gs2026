name: ZelaBairro - CI e DevSecOps

on:
  push:
  pull_request:
  workflow_dispatch:

# Permissão mínima; nenhum job publica alterações no repositório.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Testes Flask
    runs-on: ubuntu-24.04
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Testar sintaxe e jornadas do MVP
        run: |
          python -m compileall -q app tests wsgi.py
          python -m unittest discover -s tests -v

  gitleaks:
    name: Gitleaks - segredos no Git
    runs-on: ubuntu-24.04
    steps:
      - name: Obter historico completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detectar segredos sem expor valores
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  semgrep:
    name: Semgrep - analise estatica
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      # Community Edition: regras da comunidade + regra local auditavel.
      # --error faz o job falhar quando encontra um achado.
      - name: Analisar seguranca do Python
        run: semgrep scan --config p/python --config .semgrep/zelabairro.yml --error .

  docker-trivy:
    name: Docker build + Trivy
    runs-on: ubuntu-24.04
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Construir imagem sem segredos
        run: docker build --tag zelabairro:${{ github.sha }} .

      - name: Smoke test do container em producao
        env:
          TEST_IMAGE: zelabairro:${{ github.sha }}
        run: |
          set -euo pipefail
          docker volume create zelabairro-ci-data >/dev/null
          trap 'docker rm -f zelabairro-ci >/dev/null 2>&1 || true; docker volume rm zelabairro-ci-data >/dev/null 2>&1 || true' EXIT
          TEST_SECRET="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          docker run -d --name zelabairro-ci \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:8765:8000 \
            -v zelabairro-ci-data:/data \
            -e APP_ENV=production \
            -e SECRET_KEY="$TEST_SECRET" \
            -e ADMIN_PASSWORD='senha-descartavel-somente-ci' \
            -e METRICS_TOKEN="$TEST_SECRET" \
            "$TEST_IMAGE" >/dev/null
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health | grep -q '"status":"ok"'; then
              echo 'Healthcheck HTTP OK - container executando'
              exit 0
            fi
            sleep 2
          done
          docker logs zelabairro-ci
          exit 1

      - name: Trivy - CVEs altas ou criticas corrigiveis
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zelabairro:${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  ci-validada:
    name: Gate de qualidade - pronto para etapa de deploy
    runs-on: ubuntu-24.04
    needs: [unit-tests, gitleaks, semgrep, docker-trivy]
    steps:
      - name: Confirmar aprovacoes
        run: echo 'Testes + Gitleaks + Semgrep + build Docker + Trivy aprovados. Publicacao e deploy em jobs separados.'


  publicar-imagem:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-24.04
    needs: [ci-validada]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Autenticar GHCR pelo GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagem versionada e latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy-azure:
    name: Deploy automatico Azure App Service
    runs-on: ubuntu-24.04
    needs: [publicar-imagem]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Autenticar Azure sem senha via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publicar imagem aprovada do commit
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Testar URL HTTPS
        env:
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 "https://${WEBAPP_NAME}.azurewebsites.net/health" | grep -q '"status":"ok"'; then
              echo "Deploy validado: https://${WEBAPP_NAME}.azurewebsites.net/health"
              exit 0
            fi
            sleep 10
          done
          echo 'Healthcheck HTTPS falhou; consulte logs no App Service.'
          exit 1
